apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvcache-master
  namespace: aiservice
  labels:
    app: kvcache-master
    app.kubernetes.io/version: "0.3.13.post1"
    mc_cluster_id: "yuxin_0.3.13"
spec:
  replicas: 3
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: kvcache-master
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: kvcache-master
        app.kubernetes.io/version: "0.3.13.post1"
        mc_cluster_id: "yuxin_0.3.13"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kvcache-master
                operator: In
                values:
                - prod
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: kvcache-master
            topologyKey: kubernetes.io/hostname
      tolerations:
      - key: maas.xfyun.cn/component-kvcache
        operator: Exists
        effect: NoSchedule
      containers:
      - name: kvcache-master
        image: artifacts.iflytek.com/docker-private/aipaas/mooncake-gpu-runtime:tag-v0.3.13.post1-cuda13.0.1-py312-beta.1@sha256:3add846b5a69d15644fc5905c04ffa91e07bc538bd60c18d033bc32663281108
        imagePullPolicy: IfNotPresent
        # 当前镜像 entrypoint 会追加 args；catalog 没有对应的 MC_* 环境变量。
        args:
        - --snapshot_catalog_store_type=embedded
        - --enable_oplog=false
        env:
        - name: MOONCAKE_ROLE
          value: master
        - name: MC_ETCD_ENDPOINTS
          value: 10.246.42.251:2379,10.246.41.84:2379,10.246.44.47:2379
        - name: MC_RPC_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: MC_DEFAULT_KV_LEASE_TTL
          value: "300000"
        - name: MC_ENABLE_HTTP_METADATA_SERVER
          value: "true"
        - name: MC_HTTP_METADATA_SERVER_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: MC_ENABLE_HA
          value: "true"
        - name: MC_CLIENT_TTL
          value: "300"
        - name: MC_ENABLE_GROUP_TTL
          value: "true"
        - name: MC_ALLOCATION_STRATEGY
          value: free_ratio_first
        - name: C_EVICTION_RATIO
          value: "0.1"
        - name: MC_EVICTION_HIGH_WATERMARK_RATIO
          value: "0.9"
        - name: MC_CLUSTER_ID
          value: yuxin_0.3.13
        # 先验证 HA bootstrap/promotion 与真实 GET，再继续规模压测。
        - name: MC_MEMORY_ALLOCATOR
          value: offset
        - name: MC_ENABLE_SNAPSHOT
          value: "true"
        - name: MC_ENABLE_SNAPSHOT_RESTORE
          value: "true"
        - name: MC_SNAPSHOT_BACKEND_TYPE
          value: local
        - name: MOONCAKE_SNAPSHOT_LOCAL_PATH
          value: /mooncake-snapshots
        - name: MC_SNAPSHOT_INTERVAL_SECONDS
          value: "600"
        - name: MC_SNAPSHOT_CHILD_TIMEOUT_SECONDS
          value: "300"
        - name: MC_SNAPSHOT_RETENTION_COUNT
          value: "3"
        - name: MC_LOG_DIR
          value: /mclog
        - name: MC_GLOG_LOGTOSTDERR
          value: "false"
        - name: MC_GLOG_ALSOLOGTOSTDERR
          value: "true"
        - name: LD_LIBRARY_PATH
          value: /opt/mooncake/build/mooncake-store:/opt/mooncake/build/mooncake-store/src:/opt/mooncake/build/mooncake-common/etcd:/opt/mooncake/build/mooncake-asio
        ports:
        - name: rpc
          containerPort: 50051
          protocol: TCP
        - name: metadata
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9003
          protocol: TCP
        startupProbe:
          tcpSocket:
            port: metadata
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 24
        readinessProbe:
          tcpSocket:
            port: metadata
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: metadata
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: "6"
            # 5000 万 key / 16KiB 压测：为元数据及 Snapshot fork 留出余量。
            memory: 52Gi
          limits:
            cpu: "6"
            memory: 52Gi
        securityContext:
          privileged: true
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        - name: hosts
          mountPath: /etc/hosts
        - name: mclog
          mountPath: /mclog
        - name: snapshots
          mountPath: /mooncake-snapshots
      volumes:
      - name: localtime
        hostPath:
          path: /etc/localtime
          type: File
      - name: hosts
        hostPath:
          path: /etc/hosts
          type: File
      - name: mclog
        hostPath:
          path: /data1/logs/mclog
          type: DirectoryOrCreate
      # 每个 Master 节点各自持久化；这不是三个 HA 副本共享的目录。
      - name: snapshots
        hostPath:
          path: /data1/mooncake-snapshots/yuxin_0.3.13
          type: DirectoryOrCreate
